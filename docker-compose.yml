services:
  # Gateway mode. The access token and realm id arrive per request on
  # X-Qbo-Access-Token and X-Qbo-Realm-Id. Do not set QBO_ACCESS_TOKEN,
  # QBO_REALM_ID, QBO_ENV, or env_file here — that would put static vendor
  # credentials in the container. Compose interpolates CONDUIT_S2S_SECRET
  # from the project .env. For AUTH_MODE=env, pass QBO_ACCESS_TOKEN and
  # QBO_REALM_ID on that process instead (see the README).
  qbo-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: qbo-mcp:latest
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # 0.0.0.0 is the interface inside the container. The port publish above
      # stays on loopback. Startup still refuses to run without a real
      # CONDUIT_S2S_SECRET.
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
